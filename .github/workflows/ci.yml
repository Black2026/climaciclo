name: CI - testes e build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Testes, tipos e compilacao
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      CLIMACICLO_ENABLE_LEAD_SUBMISSION: "false"
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias (lockfile)
        run: bun install --frozen-lockfile

      - name: Rodar testes unitarios
        run: bun run test

      # Vite/TanStack Router regenerates src/routeTree.gen.ts during build.
      - name: Compilar aplicacao e gerar arvore de rotas
        run: bun run build

      - name: Verificar tipos TypeScript
        run: bunx tsc --noEmit
