name: Security - validar remediacao

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      CLIMACICLO_ENABLE_LEAD_SUBMISSION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Resolver dependencias e verificar novas versoes
        run: |
          bun install
          bun pm ls | grep -E 'js-yaml|seroval|source-map-js|zod' || true
      - name: Testes
        run: bun run test
      - name: Compilacao e rotas geradas
        run: bun run build
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Validar lockfile reproduzivel
        run: bun install --frozen-lockfile
      - name: Conferir lockfile versionado (sem atualizacao silenciosa)
        run: |
          echo "G2_LOCK_DIFF_BEGIN"
          git --no-pager diff --no-ext-diff -- bun.lock
          echo "G2_LOCK_DIFF_END"
          if ! git diff --quiet -- bun.lock; then
            echo "::error::bun.lock em Git diverge do resolvido pelo Bun. Commitar arquivo regenerado antes do merge."
            exit 1
          fi
          echo "Lockfile salvo no Git coincide com a resolucao efetiva."
