name: G2 - Banco PostgreSQL isolado
on:
  pull_request:
    branches: [main]
    paths:
      - "drizzle/migrations/**"
      - "scripts/g2/**"
      - ".github/workflows/g2-postgres-isolado.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste-banco:
    name: Migracao e persistencia em PostgreSQL efemero
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: teste-local-efemero
          POSTGRES_DB: climaciclo_g2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d climaciclo_g2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: teste-local-efemero
      PGDATABASE: climaciclo_g2
      CLIMACICLO_ENABLE_LEAD_SUBMISSION: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Preparar cliente PostgreSQL
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Criar roles ficticias
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/g2/bootstrap.sql
      - name: Aplicar migracao real do projeto
        run: psql -X -v ON_ERROR_STOP=1 -f drizzle/migrations/0000_migration.sql
      - name: Executar testes reais em transacao temporaria
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/g2/assert.sql
